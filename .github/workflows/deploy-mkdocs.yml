name: Deploy Docs, PDF, and Word

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pandoc & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pip install mkdocs-material weasyprint

      - name: Generate PDF and Word via Pandoc
        run: |
          mkdir -p docs/downloads
          # PDFの書き出し
          pandoc docs/process_3_2_emp.md -o docs/downloads/process_3_2_emp.pdf --pdf-engine=weasyprint
          # Word(.docx)の書き出し
          pandoc docs/process_3_2_emp.md -o docs/downloads/process_3_2_emp.docx

      - name: Deploy MkDocs to GitHub Pages
        run: mkdocs gh-deploy --force